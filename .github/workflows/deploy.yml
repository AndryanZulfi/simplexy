name: Deploy

on:
  push:
    branches: [ main ]  # sesuaikan jika branch default Anda 'master'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /path/ke/proyek/di/server   # ganti sesuai path folder proyek di server
            git pull origin main

