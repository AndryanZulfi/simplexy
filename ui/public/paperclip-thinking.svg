<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 410" width="100%" height="100%">
  <defs>
    <style>
      @keyframes simplexy-pulse {
        0%, 100% {
          transform: scale(0.96);
          transform-origin: 180px 205px;
        }
        50% {
          transform: scale(1.04);
          transform-origin: 180px 205px;
        }
      }
      @keyframes simplexy-glow-a {
        0%, 100% { opacity: 0.95; }
        50% { opacity: 0.50; }
      }
      @keyframes simplexy-glow-b {
        0%, 100% { opacity: 0.50; }
        50% { opacity: 0.95; }
      }
      .simplexy-root {
        animation: simplexy-pulse 2.2s ease-in-out infinite;
      }
      .lobe-a {
        fill: currentColor;
        animation: simplexy-glow-a 2.2s ease-in-out infinite;
      }
      .lobe-b {
        fill: currentColor;
        animation: simplexy-glow-b 2.2s ease-in-out infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .simplexy-root, .lobe-a, .lobe-b {
          animation: none;
          opacity: 0.85;
          transform: none;
        }
      }
    </style>
  </defs>
