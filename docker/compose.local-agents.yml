services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: /etc/simplexy/database.env
    environment:
      POSTGRES_USER: simplexy
      POSTGRES_DB: simplexy
    volumes:
      - simplexy-db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U simplexy -d simplexy]
      interval: 5s
      timeout: 5s
      retries: 30
  server:
    image: simplexy-local-agents:0b79435e3
    restart: unless-stopped
    env_file: /etc/simplexy/runtime.env
    ports:
      - "3100:3100"
    volumes:
      - simplexy-data:/simplexy
    depends_on:
      db:
        condition: service_healthy
    pids_limit: 2048
    stop_grace_period: 90s
volumes:
  simplexy-db:
  simplexy-data:
